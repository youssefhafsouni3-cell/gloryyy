databases:
  - name: glory-aures-db
    databaseName: glory_aures
    plan: free

services:
  - type: web
    name: glory-aures-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: glory-aures-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false